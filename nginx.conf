server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1000;

    client_max_body_size 20m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Swagger/OpenAPI JSON
    location = /api/v1/openapi.json {
        proxy_pass         http://web:5000/api/v1/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger UI
    location = /api/v1/docs {
        proxy_pass         http://web:5000/api/v1/docs;
        proxy_http_version 1.1;

        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Legacy Swagger UI
    location = /api/docs {
        proxy_pass         http://web:5000/api/docs;
        proxy_http_version 1.1;

        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Legacy OpenAPI JSON
    location = /api/openapi.json {
        proxy_pass         http://web:5000/api/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # All API calls
    location /api/ {
        proxy_pass         http://web:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie $http_cookie;

        proxy_buffer_size          128k;
        proxy_buffers              8 256k;
        proxy_busy_buffers_size    256k;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SSE stream — disable buffering
    location /api/v1/stream/ {
        proxy_pass             http://web:5000;
        proxy_http_version     1.1;

        proxy_set_header       Connection "";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Cookie $http_cookie;

        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     180s;
        chunked_transfer_encoding on;
    }
}