<style>
@keyframes spin { to { transform: rotate(360deg); } }
.top-query {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem .8rem;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 13px;
  background: var(--bg-3);
  margin-bottom: .35rem;
}
.top-query-text { color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-query-cnt  { font-family: var(--font-mono); font-size: 12px; color: var(--accent); flex-shrink: 0; margin-left: .5rem; }
</style>
